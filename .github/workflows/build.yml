name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/.toolchain/theos
    steps:
      - uses: actions/checkout@v4
      - name: Get Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: .toolchain/theos
          submodules: recursive
      - name: Build package
        run: |
          make package -j"$(sysctl -n hw.ncpu)" TARGET_CODESIGN=codesign TARGET_CODESIGN_FLAGS="-s -"
          ls -la packages/
      - uses: actions/upload-artifact@v4
        with:
          name: XHSNative
          path: packages/*.deb
